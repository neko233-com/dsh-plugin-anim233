name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: node scripts/check-syntax.cjs

      - name: Unit tests
        run: node --test "test/*.test.cjs"

  package-shape:
    name: Package shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate package.json and manifest
        run: node -e "const p=require('./package.json'); if(p.name!=='dsh-plugin-anim233') process.exit(1); if(!p.dsh?.bundle?.patch) process.exit(2); console.log('package.json OK')"
